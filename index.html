<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Переключение блоков</title>
<style>
  .tab {
    display: none;
    padding: 20px;
    border: 1px solid #ccc;
    margin-top: 10px;
  }

  .tab.active {
    display: block;
  }
</style>
</head>
<body>

<button onclick="showTab('tab1')">Вкладка 1</button>
<button onclick="showTab('tab2')">Вкладка 2</button>

<div id="tab1" class="tab active">
  <h2>Первая вкладка</h2>
  <p></p>

<div id="tab2" class="tab">
  <h2>Вторая вкладка</h2>
  <p></p>
</div>

<script>
function showTab(id) {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
}
</script>

</body>
